services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./symfony/:/app:Z
    tty: true
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /app/var:exec
      - /app/var/log
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
    env_file:
      - .env.php
    networks:
      - backend

  db:
    image: docker.io/library/postgres:16
    restart: always
    env_file:
      - .env.db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U symfony" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  db_data:


networks:
  backend:
