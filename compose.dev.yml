services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./symfony/:/app
    tmpfs:
      - /app/var
      - /app/var/log
    env_file:
      - .env.php
    networks:
      - backend

  db:
    image: postgres:16
    restart: always
    env_file:
      - .env.db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U symfony" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  db_data:


networks:
  backend:
